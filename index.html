<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Carga - Express Log</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card-container">
        <div id="status-bar" class="status-disponivel">
            <span id="status-text">BAIA DISPONÍVEL</span>
        </div>

        <div class="panel-content">
            <h2>CONTROLE DE CARGA</h2>

            <div class="counter-display">
                <span id="counter-value">0</span>
            </div>
            <p class="limit-text">Limite de 50 pacotes</p>

            <div class="button-group">
                <button id="btn-add-1" class="btn-increment" onclick="alterarContador(1)">+1 Pacote</button>
                <button id="btn-add-5" class="btn-increment" onclick="alterarContador(5)">+5 Pacotes<br><small>(Lote)</small></button>
            </div>
        </div>

        <button id="btn-reset" class="btn-reset" onclick="despacharBaia()">Despachar/Limpar Baia</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
